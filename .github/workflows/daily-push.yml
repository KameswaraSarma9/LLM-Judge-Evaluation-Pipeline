name: Automated Daily Push

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at 12:00 AM UTC
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  auto-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Make a Daily Update
        run: |
          echo "Last automated update: $(date)" > daily_log.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_log.txt
          git commit -m "chore: automated daily push $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
